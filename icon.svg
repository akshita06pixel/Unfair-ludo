<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff4b72"/>
      <stop offset="100%" stop-color="#d90429"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f59b"/>
      <stop offset="100%" stop-color="#00a86b"/>
    </linearGradient>
    <linearGradient id="yellowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffea00"/>
      <stop offset="100%" stop-color="#ff9100"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#0077b6"/>
    </linearGradient>
    <linearGradient id="goldCrown" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff3b0"/>
      <stop offset="50%" stop-color="#ffd700"/>
      <stop offset="100%" stop-color="#ffaa00"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background App Tile -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="106" fill="none" stroke="rgba(255, 255, 255, 0.15)" stroke-width="6"/>

  <!-- 4 Ludo Quadrants Glow Rings -->
  <circle cx="145" cy="145" r="75" fill="url(#redGrad)" opacity="0.85" filter="url(#shadow)"/>
  <circle cx="367" cy="145" r="75" fill="url(#greenGrad)" opacity="0.85" filter="url(#shadow)"/>
  <circle cx="367" cy="367" r="75" fill="url(#yellowGrad)" opacity="0.85" filter="url(#shadow)"/>
  <circle cx="145" cy="367" r="75" fill="url(#blueGrad)" opacity="0.85" filter="url(#shadow)"/>

  <!-- Inner Rings -->
  <circle cx="145" cy="145" r="45" fill="#0f172a" stroke="#ff4b72" stroke-width="6"/>
  <circle cx="367" cy="145" r="45" fill="#0f172a" stroke="#00f59b" stroke-width="6"/>
  <circle cx="367" cy="367" r="45" fill="#0f172a" stroke="#ffea00" stroke-width="6"/>
  <circle cx="145" cy="367" r="45" fill="#0f172a" stroke="#00e5ff" stroke-width="6"/>

  <!-- Center Isometric 3D Dice Card -->
  <g transform="translate(256, 256) scale(1.05)" filter="url(#shadow)">
    <!-- 3D Isometric Cube Faces -->
    <!-- Top Face (6 Pips) -->
    <path d="M 0,-85 L 75,-42 L 0,0 L -75,-42 Z" fill="#ffffff"/>
    <path d="M 0,-85 L 75,-42 L 0,0 L -75,-42 Z" fill="url(#goldCrown)" opacity="0.2"/>
    
    <!-- Left Face (5 Pips) -->
    <path d="M -75,-42 L 0,0 L 0,85 L -75,42 Z" fill="#e2e8f0"/>
    
    <!-- Right Face (4 Pips) -->
    <path d="M 0,0 L 75,-42 L 75,42 L 0,85 Z" fill="#cbd5e1"/>

    <!-- Pips Top Face -->
    <circle cx="-35" cy="-52" r="6" fill="#0f172a"/>
    <circle cx="0" cy="-62" r="6" fill="#0f172a"/>
    <circle cx="35" cy="-32" r="6" fill="#0f172a"/>
    <circle cx="-35" cy="-32" r="6" fill="#0f172a"/>
    <circle cx="0" cy="-22" r="6" fill="#0f172a"/>
    <circle cx="35" cy="-52" r="6" fill="#0f172a"/>

    <!-- Pips Left Face -->
    <circle cx="-38" cy="0" r="6" fill="#1e293b"/>
    <circle cx="-38" cy="42" r="6" fill="#1e293b"/>
    <circle cx="-55" cy="21" r="6" fill="#1e293b"/>
    <circle cx="-20" cy="21" r="6" fill="#1e293b"/>
    <circle cx="-38" cy="21" r="6" fill="#d90429"/>

    <!-- Pips Right Face -->
    <circle cx="20" cy="21" r="6" fill="#1e293b"/>
    <circle cx="55" cy="21" r="6" fill="#1e293b"/>
    <circle cx="38" cy="0" r="6" fill="#1e293b"/>
    <circle cx="38" cy="42" r="6" fill="#1e293b"/>
  </g>

  <!-- Crown on Top of Dice -->
  <path d="M 226,135 L 241,155 L 256,125 L 271,155 L 286,135 L 282,170 L 230,170 Z" 
        fill="url(#goldCrown)" stroke="#ffd700" stroke-width="2" filter="url(#glow)"/>
  <circle cx="226" cy="135" r="3.5" fill="#ffffff"/>
  <circle cx="256" cy="125" r="4.5" fill="#ffffff"/>
  <circle cx="286" cy="135" r="3.5" fill="#ffffff"/>
</svg>
